<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00eaff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <title>Mehran Hakimi | Front-End Developer</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <style>
      :root {
        --bg: #f4f7fc;
        --card: #05475b;
        --text: #111111;
        --primary: #0077ff;
        --secondary: #05475b;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
        transition: 0.4s;
        overflow-x: hidden;
      }

      .card {
        width: 420px;
        max-width: 100%;
        background: var(--card);
        border-radius: 30px;
        padding: 30px;
        text-align: center;
        position: relative;
        overflow: hidden;

        box-shadow:
          0 0 20px var(--primary),
          0 0 60px rgba(0, 234, 255, 0.3);

        transform-style: preserve-3d;
        transition: 0.4s;
      }

      .card:hover {
        transform: rotateX(6deg) rotateY(-6deg) scale(1.02);
      }

      .glow {
        position: absolute;
        inset: -4px;
        background: linear-gradient(
          45deg,
          #00eaff,
          rgba(0, 234, 255, 0.3),
          #e3e9e6,
          rgba(0, 234, 255, 0.3)
        );
        z-index: -1;
        filter: blur(20px);
      }

      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }

      #themeBtn {
        position: absolute;
        top: 15px;
        right: 15px;
        width: 50px;
        height: 50px;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        font-size: 18px;
      }

      .profile {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 50%;
        border: 4px solid var(--primary);
        margin-bottom: 15px;
      }

      h1 {
        margin-bottom: 5px;
      }

      #typing {
        color: var(--primary);
        height: 30px;
        margin-bottom: 15px;
      }

      .location {
        opacity: 0.8;
        margin-bottom: 20px;
      }

      .socials {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin: 20px 0;
      }

      .socials a {
        width: 55px;
        height: 55px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-decoration: none;
        border-radius: 50%;
        font-size: 22px;
        background: rgba(255, 255, 255, 0.1);
        color: white;
        transition: 0.3s;
      }

      .socials a:hover {
        background: var(--primary);
        transform: translateY(-6px);
      }

      #qrcode {
        margin: 20px auto;
        width: max-content;
        background: white;
        padding: 10px;
        border-radius: 15px;
      }

      .btn {
        display: inline-block;
        margin: 8px;
        padding: 12px 24px;
        background: var(--primary);
        color: white;
        text-decoration: none;
        border-radius: 30px;
        font-weight: bold;
        transition: 0.3s;
      }

      .btn:hover {
        transform: scale(1.05);
      }

      .section {
        margin-top: 25px;
        text-align: left;
      }

      .section h2 {
        margin-bottom: 15px;
        color: var(--primary);
      }

      .skill {
        margin-bottom: 15px;
      }

      .bar {
        height: 10px;
        background: #222;
        border-radius: 20px;
        overflow: hidden;
      }

      .fill {
        height: 100%;
        background: linear-gradient(90deg, #00eaff, #00ff88);
      }

      .project {
        padding: 12px;
        margin: 10px 0;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 12px;
      }

      footer {
        margin-top: 20px;
        font-size: 13px;
        opacity: 0.7;
      }

      @media (max-width: 480px) {
        body {
          padding: 15px;
        }

        .card {
          width: 100%;
          padding: 20px;
          border-radius: 20px;
        }

        .profile {
          width: 120px;
          height: 120px;
        }

        h1 {
          font-size: 26px;
        }

        #typing {
          font-size: 18px;
        }

        .socials {
          gap: 10px;
        }

        .socials a {
          width: 48px;
          height: 48px;
          font-size: 20px;
        }

        .btn {
          width: 100%;
          margin: 6px 0;
        }

        #qrcode canvas {
          width: 120px !important;
          height: 120px !important;
        }

        .project {
          font-size: 14px;
        }
      }

      @media (min-width: 481px) and (max-width: 768px) {
        .card {
          width: 95%;
          max-width: 500px;
        }
      }

      @media (min-width: 1200px) {
        .card {
          width: 500px;
        }
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="glow"></div>

      <img src="./IMG_4238.JPG" class="profile" />

      <h1>Mehran Hakimi</h1>

      <h3 id="typing"></h3>

      <p class="location">📍 Kabul, Afghanistan</p>

      <div class="socials">
        <a
          href="https://www.facebook.com/share/18f2oCB7ci/?mibextid=wwXIfr"
          target="_blank"
        >
          <i class="fab fa-facebook-f"></i>
        </a>

        <a href="https://instagram.com/_official.hakimi_" target="_blank">
          <i class="fab fa-instagram"></i>
        </a>

        <a href="https://t.me/@mhakimi788" target="_blank">
          <i class="fab fa-telegram"></i>
        </a>

        <a href="https://wa.me/93778212723" target="_blank">
          <i class="fab fa-whatsapp"></i>
        </a>

        <a href="tel:+93778212723">
          <i class="fas fa-phone"></i>
        </a>
      </div>

      <div id="qrcode"></div>

      <a href="#" class="btn" id="saveContact"> Save Contact</a>

      <a href="./photo_2026-04-29_22-43-11.jpg" class="btn" download>
        Download CV
      </a>

      <div class="section">
        <h2>Skills</h2>

        <div class="skill">
          HTML
          <div class="bar">
            <div class="fill" style="width: 98%"></div>
          </div>
        </div>

        <div class="skill">
          CSS
          <div class="bar">
            <div class="fill" style="width: 98%"></div>
          </div>
        </div>

        <div class="skill">
          JavaScript
          <div class="bar">
            <div class="fill" style="width: 94%"></div>
          </div>
        </div>

        <div class="skill">
          Responsive Design
          <div class="bar">
            <div class="fill" style="width: 95%"></div>
          </div>
        </div>
      </div>

      <div class="section">
        <h2>Projects</h2>

        <div class="project">🌐 Portfolio Website</div>

        <div class="project">🎓 Student Management System</div>

        <div class="project">📱 NFC Digital Business Card</div>

        <div class="project">🛒 E-Commerce Front-End</div>
      </div>

      <footer>© 2026 Mehran Hakimi</footer>
    </div>

    <script>
      new QRCode(document.getElementById("qrcode"), {
        text: "https://hakimi.dev",
        width: 150,
        height: 150,
      });

      const text = "Front-End Developer";
      let i = 0;

      function typing() {
        if (i < text.length) {
          document.getElementById("typing").innerHTML += text.charAt(i);
          i++;
          setTimeout(typing, 100);
        }
      }

      typing();

      document
        .getElementById("saveContact")
        .addEventListener("click", function () {
          const vcf = `BEGIN:VCARD
VERSION:3.0
FN:Mehran Hakimi
TITLE:Front-End Developer
TEL:+93778212723
EMAIL:mehranhakimi2021@gmail.com
URL:https://hakimi.dev
END:VCARD`;

          const blob = new Blob([vcf], { type: "text/vcard" });

          const link = document.createElement("a");

          link.href = URL.createObjectURL(blob);

          link.download = "MehranHakimi.vcf";

          link.click();
        });
    </script>
  </body>
</html>
